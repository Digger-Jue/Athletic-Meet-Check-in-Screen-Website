<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>检录信息</title>
<style>
  :root {
    --rows: 11;
    --row-h: calc(100vh / var(--rows));
    --fs: min(calc(100vh / var(--rows) * 0.52), 3vw);
  }
  @supports (height: 100dvh) {
    :root {
      --row-h: calc(100dvh / var(--rows));
      --fs: min(calc(100dvh / var(--rows) * 0.52), 3vw);
    }
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    -webkit-text-size-adjust: 100%;
  }
  body {
    color: #fff;
    font-family: "Microsoft YaHei", "PingFang SC", "Heiti SC", "Noto Sans SC", sans-serif;
  }

  .screen {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: var(--fs);
    flex: none;
  }

  th, td {
    height: var(--row-h);
    padding: 0 0.08em;
    text-align: center;
    vertical-align: middle;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #fff;
    border: none;
    font-size: inherit;
    letter-spacing: 0;
  }

  thead th {
    background: #06182e;
    font-weight: 700;
  }

  tbody tr:nth-child(odd)  td { background: #12345e; }
  tbody tr:nth-child(even) td { background: #2563a8; }

  /* 状态颜色 */
  .st-wait  { color: #ffffff; }   /* 等待检录：白色 */
  .st-go    { color: #00e676; }   /* 正在检录：绿色 */
  .st-stop  { color: #ff3b30; }   /* 停止检录：红色 */
  .st-early { color: #00d4ff; }   /* 早X分：青色 */
  .st-late  { color: #ffb020; }   /* 晚X分：橙色 */
</style>
</head>
<body>

<div class="screen">
  <table>
    <colgroup>
      <col style="width:4.8em">
      <col>
      <col style="width:5.5em">
      <col style="width:5.5em">
      <col style="width:5em">
      <col style="width:5em">
      <col style="width:5em">
    </colgroup>
    <thead>
      <tr>
        <th>姓名</th>
        <th>项目</th>
        <th>检录口</th>
        <th>道次</th>
        <th>开始时间</th>
        <th>检录时间</th>
        <th>状态</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script src="data.js"></script>

<script>
/* =========================================================
   读取数据（带兜底）
   ========================================================= */
const CONFIG = window.CHECKIN_CONFIG || {
  MAX_ROWS: 10,
  STOP_REMOVE_MS: 10 * 60 * 1000,
  TIME_MODE: 'absolute'
};
const DATA = window.CHECKIN_DATA || [];

const MAX_ROWS       = CONFIG.MAX_ROWS;
const STOP_REMOVE_MS = CONFIG.STOP_REMOVE_MS;
const TIME_MODE      = CONFIG.TIME_MODE;

/* =========================================================
   时间换算
   ========================================================= */
const now = new Date();
const currentMinute = Math.floor(now.getTime() / 60000) * 60000;
const todayStart    = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();

function parseTime(value) {
  if (TIME_MODE === 'absolute') {
    const [h, m] = String(value).split(':').map(Number);
    return todayStart + (h * 60 + m) * 60000;
  }
  return currentMinute + Number(value) * 60000;
}

/* =========================================================
   构建运行时记录
   offsetMin > 0 → 提前；offsetMin < 0 → 晚点
   实际开始时间 = 原定开始时间 - offsetMin 分钟
   ========================================================= */
const records = DATA.map((d, i) => {
  const offsetMin       = Number(d.offset) || 0;
  const checkinTs       = parseTime(d.checkin);
  const originalStartTs = parseTime(d.start);
  const adjustedStartTs = originalStartTs - offsetMin * 60000;

  return {
    id: i,
    name: d.name,
    event: d.event,
    gate: d.gate,
    lane: d.lane,
    offsetMin,
    checkinTs,
    originalStartTs,   // 用于表格展示
    startTs: adjustedStartTs  // 用于状态判断与移除计时
  };
});

/* =========================================================
   渲染
   ========================================================= */
const tbody = document.getElementById('rows');
let lastHTML = '';

function fmtTime(ts) {
  const d = new Date(ts);
  return String(d.getHours()).padStart(2, '0') + ':' +
         String(d.getMinutes()).padStart(2, '0');
}

/* 状态判断：
   1. 实际开始时间之前 → 显示偏移提示（早X分 / 晚X分）
      若 offset 为 0，则显示正常的等待检录 / 正在检录
   2. 实际开始时间之后 → 显示停止检录
*/
function statusOf(rec, nowTs) {
  if (nowTs < rec.startTs) {
    if (rec.offsetMin > 0) {
      return { text: `早${rec.offsetMin}分`, cls: 'st-early' };
    }
    if (rec.offsetMin < 0) {
      return { text: `晚${Math.abs(rec.offsetMin)}分`, cls: 'st-late' };
    }
    // offset 为 0 的兜底
    if (nowTs < rec.checkinTs) return { text: '等待检录', cls: 'st-wait' };
    return { text: '正在检录', cls: 'st-go' };
  }
  return { text: '停止检录', cls: 'st-stop' };
}

function update() {
  const nowTs = Date.now();
  const list = [];

  for (const rec of records) {
    const st = statusOf(rec, nowTs);

    // 停止检录满 10 分钟 → 丢弃该行
    if (st.cls === 'st-stop' && nowTs >= rec.startTs + STOP_REMOVE_MS) continue;

    if (list.length >= MAX_ROWS) break;
    list.push({ rec, st });
  }

  const html = list.map(({ rec, st }) => `
    <tr>
      <td>${rec.name}</td>
      <td>${rec.event}</td>
      <td>${rec.gate}</td>
      <td>${rec.lane}</td>
      <td>${fmtTime(rec.originalStartTs)}</td>
      <td>${fmtTime(rec.checkinTs)}</td>
      <td class="${st.cls}">${st.text}</td>
    </tr>`).join('');

  if (html !== lastHTML) {
    tbody.innerHTML = html;
    lastHTML = html;
  }
}

update();
setInterval(update, 1000);
</script>

</body>
</html>
